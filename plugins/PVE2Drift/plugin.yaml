id: pve2drift
name: PVE2 Drift
version: 0.1.0
core_compat: ">=0.1.0,<2.0.0"
description: Detect drift between OpenTofu declared state and the live Proxmox cluster (tag-based matching, push ingestion from CI).
author: PVE2 Services Contributors
icon: "🧭"
capabilities:
  reads: [cluster_state, machine_cache, connector_config]
  writes: [drift_state, audit_findings]
trust_tier: trusted
license_required: false
mcp:
  enabled: true
  tools:
    - name: list_managed_resources
      description: List IaC-declared resources tracked for drift.
      handler: "mcp_tools:list_managed_resources"
      capability: drift_state
      input_schema: {type: object, properties: {}, additionalProperties: false}
    - name: list_open_drifts
      description: List currently open drift events.
      handler: "mcp_tools:list_open_drifts"
      capability: drift_state
      input_schema: {type: object, properties: {}, additionalProperties: false}
    - name: list_drift_events
      description: List drift events, optionally filtered by status.
      handler: "mcp_tools:list_drift_events"
      capability: drift_state
      input_schema:
        type: object
        properties:
          status: {type: string}
          limit: {type: integer}
        additionalProperties: false
