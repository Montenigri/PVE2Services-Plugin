id: pve2proxy
name: PVE2 Proxy
version: 0.1.0
core_compat: ">=0.1.0,<2.0.0"
description: Reverse proxy configuration generator with SSH deploy.
author: PVE2 Services Contributors
icon: "🌐"
capabilities:
  reads: [machine_cache, connector_config]
  writes: [proxy_configs]
trust_tier: trusted
license_required: false
mcp:
  enabled: true
  tools:
    - name: list_mappings
      description: List every generated reverse-proxy mapping.
      handler: "mcp_tools:list_mappings"
      capability: proxy_configs
      input_schema: {type: object, properties: {}, additionalProperties: false}
    - name: get_mapping
      description: Return one reverse-proxy mapping by machine id.
      handler: "mcp_tools:get_mapping"
      capability: proxy_configs
      input_schema:
        type: object
        properties: {machine_id: {type: string}}
        required: [machine_id]
        additionalProperties: false
