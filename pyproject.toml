[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pve2-plugins"
version = "0.1.0"
description = "First-party plugins for PVE2Services"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "PVE2 Services Contributors" },
]
keywords = ["proxmox", "homelab", "plugins", "dns", "notifications", "wiki", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]
# The core library is the runtime contract used by every plugin. CI pins the
# matching core tag via PVE2_CORE_SPEC (see .github/workflows/ci.yml).
dependencies = [
    "pve2>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/Montenigri/pve2service-core"
Repository = "https://github.com/Montenigri/PVE2Services-Plugin"
Issues = "https://github.com/Montenigri/PVE2Services-Plugin/issues"
Changelog = "https://github.com/Montenigri/PVE2Services-Plugin/blob/main/CHANGELOG.md"


[project.optional-dependencies]
test = ["pytest", "httpx"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
