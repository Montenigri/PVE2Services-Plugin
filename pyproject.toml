[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pve2-plugins"
version = "0.1.0"
description = "First-party plugins for PVE2Services"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "PVE2 Services Contributors" },
]
# The core library is the runtime contract used by every plugin. Pin a
# compatible range; CI installs the matching `pve2` wheel.
dependencies = [
    "pve2>=0.1.0",
]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
