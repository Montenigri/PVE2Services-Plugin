name: CI

on: [push, pull_request]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Install the core library
        env:
          # Published wheel. Override with a repo variable, e.g. a GitHub
          # Packages URL with credentials, or a pinned version.
          PVE2_CORE_SPEC: ${{ vars.PVE2_CORE_SPEC || 'pve2' }}
        run: pip install "$PVE2_CORE_SPEC"

      - name: Run ruff
        run: ruff check .

      - name: Run tests
        run: pytest -q tests

  integration:
    # Load the plugins through the real core app to catch discovery/manifest
    # regressions end to end.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Install the core library
        env:
          PVE2_CORE_SPEC: ${{ vars.PVE2_CORE_SPEC || 'pve2' }}
        run: pip install "$PVE2_CORE_SPEC"

      - name: Verify every manifest
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          from PVE2Services.libs.plugin_manifest import load_manifest
          from PVE2Services.libs.plugin_loader import CORE_VERSION

          root = Path("plugins")
          failed = False
          for d in sorted(p for p in root.iterdir() if p.is_dir()):
              try:
                  m = load_manifest(d)
                  if not m.satisfies_core(CORE_VERSION):
                      raise SystemExit(
                          f"{m.id}: requires core {m.core_compat}, running {CORE_VERSION}"
                      )
                  print(f"ok  {m.id} {m.version}")
              except Exception as exc:  # noqa: BLE001
                  failed = True
                  print(f"FAIL {d.name}: {exc}")
          sys.exit(1 if failed else 0)
          PY
