version: 2
updates:
  # Python deps: one grouped PR per week.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 3
    groups:
      python-deps:
        patterns: ["*"]

  # All GitHub Actions bumps in a single PR.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
